name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the GPU unit tests and runs them on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.
#
# Not run here: `make test-msm` and `make test-msm-g2`. The simulator rejects
# the PTX of the MSM kernels g1_reduce_chunked, g1_combine (G1) and the G2
# equivalent, because nvcc declares more than 65,536 virtual registers in them
# (about 110,000 .b64 registers in g1_reduce_chunked) and the simulator
# accepts at most 65,536 per kernel. The other MSM kernels are fine. These two
# tests need that limit lifted in the simulator or smaller unrolled kernels.

on:
  push:
    branches: [ verify-gpu-sim ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "include/**"
      - "test/unit/**"
      - "Makefile"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Fp Fr NTT unit tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The Makefile default ARCH=sm_120 embeds SASS only, which the simulator
      # cannot run, so build PTX with ARCH=compute_90. The simulator also needs
      # a shared CUDA runtime, hence `-cudart shared` in NVCC.
      - name: Build the unit tests
        run: |
          make -j3 ARCH=compute_90 NVCC="nvcc -cudart shared" \
            build/tests/test_fp build/tests/test_fr build/tests/test_ntt

      # Each test exits non-zero when any vector does not match, so a wrong
      # result fails the step.
      - name: Fp (BN254 base field)
        run: vgpu run build/tests/test_fp test/unit/test_vectors.json

      - name: Fr (BN254 scalar field)
        run: vgpu run build/tests/test_fr test/unit/test_vectors_fr.json

      - name: NTT
        run: vgpu run build/tests/test_ntt test/unit/test_vectors_ntt.json
